name: Release

on:
  release:
    types: [published]
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Xmx6g -Xms4g"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # checkout v1 fetched the full history and tags (semantic-version, git-publish)
      - name: Set up JDK 1.8
        uses: actions/setup-java@v6
        with:
          distribution: zulu # was implicit in setup-java v1
          java-version: 8 # setup-java v2+ dropped the legacy "1.8" syntax
      - name: Semantic Version
        id: version
        uses: ncipollo/semantic-version-action@v1
      - name: Decode PGP
        id: write_file
        uses: timheuer/base64-to-file@v1
        with:
          fileName: 'secret.pgp'
          encodedString: ${{ secrets.SIGNING_SECRET_KEY_BASE64 }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Publish
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_SECRET_KEY_PATH: ${{ steps.write_file.outputs.filePath }}
          VERSION: ${{ steps.version.outputs.tag }}
          GRGIT_AUTH_USERNAME: ${{ secrets.AGORAPULSE_BOT_PERSONAL_TOKEN }}
        run: ./gradlew gitPublishPush publishToSonatype closeAndReleaseSonatypeStagingRepository "-Pversion=$VERSION" -Prelease=true "-Dorg.ajoberstar.grgit.auth.username=$GRGIT_AUTH_USERNAME" --stacktrace
