name: automerge
on:
  pull_request:
    types:
      - labeled
      - unlabeled
      - synchronize
      - opened
      - edited
      - ready_for_review
      - reopened
      - unlocked
  pull_request_review:
    types:
      - submitted
  check_suite:
    types:
      - completed
  status: {}
permissions:
  contents: read
jobs:
  automerge:
    runs-on: ubuntu-latest
    # Same event filters as the former pascalgn/automerge-action:
    # approved reviews, successful check suites and successful statuses only.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') ||
      (github.event_name == 'check_suite' && github.event.check_suite.conclusion == 'success') ||
      (github.event_name == 'status' && github.event.state == 'success')
    steps:
      - name: Merge the pull request when it is labelled and mergeable
        env:
          # All API calls run as agorapulse-bot, as before.
          GH_TOKEN: ${{ secrets.AGORAPULSE_BOT_PERSONAL_TOKEN }}
          # Defaults of pascalgn/automerge-action v0.16.2, which this workflow replaces.
          MERGE_LABEL: automerge
          MERGE_METHOD: merge
          MERGE_READY_STATE: clean,has_hooks,unknown,unstable
          MERGE_RETRIES: '6'
          MERGE_RETRY_SLEEP: '5'
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.check_suite.head_sha || github.event.sha }}
        run: |
          set -euo pipefail

          if [[ -z "$GH_TOKEN" ]]; then
            # Fork and Dependabot pull requests get no repository secrets, so there is nothing to merge with.
            echo "::notice::No AGORAPULSE_BOT_PERSONAL_TOKEN available for this event (fork or Dependabot pull request); skipping"
            exit 0
          fi

          if [[ -n "$PR_NUMBER" ]]; then
            prs="$PR_NUMBER"
          else
            # check_suite / status: the open pull requests whose head is the commit that went green
            # shellcheck disable=SC2016 # $ENV.EVENT_SHA is a jq variable
            prs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$EVENT_SHA/pulls" \
              --jq '.[] | select(.state == "open" and .head.sha == $ENV.EVENT_SHA) | .number')
          fi
          if [[ -z "$prs" ]]; then
            echo "No open pull request for this event"
            exit 0
          fi

          for pr in $prs; do
            echo "::group::Pull request #$pr"
            sha=""
            ready=false
            # Wait until GitHub reports a mergeable state (initial check + MERGE_RETRIES retries).
            for attempt in $(seq 0 "$MERGE_RETRIES"); do
              if (( attempt > 0 )); then
                echo "Retrying in ${MERGE_RETRY_SLEEP}s ($attempt/$MERGE_RETRIES)"
                sleep "$MERGE_RETRY_SLEEP"
              fi
              # shellcheck disable=SC2016 # $ENV.MERGE_LABEL is a jq variable
              info=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '[
                .state, .merged, .draft,
                ([.labels[].name] | index($ENV.MERGE_LABEL) != null),
                (.mergeable_state // "unknown"), .head.sha
              ] | @tsv')
              IFS=$'\t' read -r pr_state merged draft labelled mergeable_state head_sha <<<"$info"
              # Merge the head commit seen when the run started, never a later push.
              sha="${sha:-$head_sha}"
              if [[ "$pr_state" != "open" || "$merged" == "true" ]]; then
                echo "Skipping: pull request is $pr_state (merged: $merged)"
                break
              fi
              if [[ "$labelled" != "true" ]]; then
                echo "Skipping: required label '$MERGE_LABEL' is missing"
                break
              fi
              if [[ "$draft" == "true" || "$mergeable_state" == "dirty" || "$mergeable_state" == "draft" ]]; then
                echo "Not ready: mergeable_state=$mergeable_state draft=$draft"
                break
              fi
              if [[ ",$MERGE_READY_STATE," == *",$mergeable_state,"* ]]; then
                echo "Ready: mergeable_state=$mergeable_state"
                ready=true
                break
              fi
              echo "Current mergeable_state: $mergeable_state"
            done

            if [[ "$ready" == "true" ]]; then
              for attempt in $(seq 0 "$MERGE_RETRIES"); do
                if (( attempt > 0 )); then
                  echo "Retrying merge in ${MERGE_RETRY_SLEEP}s ($attempt/$MERGE_RETRIES)"
                  sleep "$MERGE_RETRY_SLEEP"
                  if [[ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .merged)" == "true" ]]; then
                    echo "Pull request #$pr is merged"
                    break
                  fi
                fi
                # GitHub's default merge commit title and an empty body, as before.
                if out=$(gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$pr/merge" \
                      -f merge_method="$MERGE_METHOD" -f sha="$sha" -f commit_message= 2>&1); then
                  echo "Pull request #$pr is merged"
                  break
                fi
                echo "Failed to merge: $out"
                if [[ "$out" == *"required by reviewers with write access"* || "$out" == *"API rate limit exceeded"* ]]; then
                  break
                fi
              done
            fi
            echo "::endgroup::"
          done
